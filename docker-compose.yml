services:
  backend:
    build:
      context: ./backend
    container_name: facturas_backend
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5433
      - DB_NAME=${DB_NAME:-Facturas}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - ENVIRONMENT=development
      - FACTURAS_PENDIENTES=/app/data/Data/Pendientes
      - FACTURAS_PROCESADAS=/app/data/Data/Procesadas
      - EXPORT_DIRECTORY=/app/data/Data/Exportadas
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - F:/1. Cloud/4. AI/1. Antigravity/Facturas:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: facturas_frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
